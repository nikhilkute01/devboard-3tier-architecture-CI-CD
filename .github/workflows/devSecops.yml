name: DevSecOps

on:
    push:
        branches: [main]

jobs:

    ## ---- CI ----
  
    code-quality:
        uses: ./.github/workflows/code-quality.yml

   
    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml

    dependency-checks:
        uses: ./.github/workflows/dependency-scan.yml

    docker-checks:
        uses: ./.github/workflows/docker-scan.yml
        secrets: inherit 

    sonar-qube:
        uses: ./.github/workflows/sonar-queu.yml
        secrets: inherit
    
    code-tests:
        uses: ./.github/workflows/code-test.yml

    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality,code-tests,sonar-qube,docker-checks,dependency-checks,secret-scanning]
        secrets: inherit

    

  